[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.2.0"
description = "Forge: an autonomous, MCP-powered coding agent for the terminal"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools]
packages = ["forge", "rag_server"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
